<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار نسا وتوليد · Ob/Gyn Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- خط Lalezar -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e5e7eb;--soft:#f1f5f9;
  --shadow:0 4px 24px rgba(15,23,42,.06);--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;
  --g1:#d81b60;--g2:#8e24aa;--grad:linear-gradient(135deg,#d81b60,#8e24aa);--tint:rgba(216,27,96,.08);
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--soft:#0f172a;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;transition:background .28s var(--ease),color .28s var(--ease)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 90% -5%,rgba(216,27,96,.14),transparent),radial-gradient(500px 400px at 5% 105%,rgba(142,36,170,.12),transparent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.en{font-family:'Inter',system-ui,sans-serif;direction:ltr;text-align:left}
.ar{font-family:'Cairo',sans-serif;direction:rtl;text-align:right}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.hidden{display:none!important}

/* ---------- Intro Animation ---------- */
#intro-screen{
    position:fixed;inset:0;background:radial-gradient(circle,#1e293b,#0f172a);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:9999;transition:opacity 0.8s ease-in-out;
    cursor: pointer;
}
.glow-text{
    font-family:'Lalezar', cursive;
    color:#fff;
    font-size:3.5rem;
    text-align:center;
    font-weight:normal;
    text-shadow:0 0 10px #fff,0 0 20px #fff,0 0 30px #d81b60,0 0 40px #d81b60,0 0 50px #d81b60,0 0 60px #d81b60;
    animation:pulseGlow 1.5s infinite alternate;
    padding:20px;
    line-height: 1.4;
}
@keyframes pulseGlow{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.05);opacity:1}}
.loading-bar{margin-top:30px;width:200px;height:5px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;box-shadow:0 0 10px #d81b60;}
.loading-bar span{display:block;width:0;height:100%;background:#d81b60;box-shadow:0 0 15px #d81b60;animation:load 3s forwards;}
@keyframes load{0%{width:0}100%{width:100%}}

/* ---------- Welcome ---------- */
.hero{text-align:center;padding:24px 0 8px;animation:rise .6s var(--ease) both}
.badge{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#d81b60,#8e24aa);box-shadow:0 0 0 6px rgba(216,27,96,.15),0 8px 30px rgba(216,27,96,.45)}
h1{font-size:32px;font-weight:700}
.sub{color:var(--muted);margin-top:4px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pill{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.sacred{margin:22px 0;text-align:center;padding:24px 18px;border-radius:24px;background:linear-gradient(135deg,#fef3c7,#fde68a,#fcd34d);border:2px solid rgba(245,158,11,.25);box-shadow:0 10px 40px rgba(245,158,11,.28);animation:rise .7s .1s var(--ease) both}
.sacred .ic{font-size:30px}
.sacred .main{font-family:'Amiri',serif;font-size:26px;font-weight:700;color:#92400e;margin:6px 0 10px;line-height:1.8}
.sacred hr{border:none;height:1px;background:rgba(146,64,14,.25);width:60%;margin:0 auto 10px}
.sacred .dua{font-size:14px;font-style:italic;color:#b45309;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.feat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .28s var(--ease),box-shadow .28s var(--ease);animation:rise .6s .2s var(--ease) both}
.feat:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,23,42,.12)}
.feat .e{display:block;font-size:26px;margin-bottom:4px}
.setup{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);animation:rise .6s .3s var(--ease) both}
.setup h3{font-size:16px;margin-bottom:10px}
.lecs{display:grid;gap:8px;margin-bottom:16px}
.lec{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:12px;border:2px solid var(--border);cursor:pointer;user-select:none}
.lec input{width:20px;height:20px;accent-color:#d81b60}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;font-family:'Inter',sans-serif;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:12px;border-top:1px dashed var(--border)}
.row label.t{font-weight:600;font-size:15px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:2;margin:0}
.sw i{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.28s var(--ease)}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.28s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked+i{background:#d81b60}
.sw input:checked+i::after{inset-inline-start:25px}
.sw input:focus-visible+i{outline:3px solid #3b82f6;outline-offset:2px}
.seg{display:flex;border:2px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{padding:8px 16px;min-height:40px;font-weight:600;font-size:14px}
.seg button.on{background:linear-gradient(135deg,#d81b60,#8e24aa);color:#fff}
.cta{text-align:center;margin:24px 0 8px}
.start{width:100%;max-width:420px;height:60px;border-radius:16px;background:linear-gradient(135deg,#d81b60,#8e24aa);color:#fff;font-size:20px;font-weight:700;box-shadow:0 8px 24px rgba(216,27,96,.4);animation:pulse 2s infinite;transition:transform .28s var(--ease)}
.start:hover{transform:translateY(-2px)}
.hint{margin-top:10px;font-size:12px;color:var(--muted)}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
.foot b{color:var(--text);font-size:15px}
.err{color:var(--err);font-size:13px;margin-top:8px;text-align:center}

/* ---------- Quiz ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topin{max-width:780px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.topin .ttl{font-weight:700;font-size:14px}
.topin .mid{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.topin .end{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.ib{width:44px;height:44px;border-radius:12px;font-size:18px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border)}
.prog{height:5px;background:var(--border)}
.prog>div{height:100%;width:0;background:var(--grad);transition:width .4s var(--ease)}
.qwrap{max-width:780px;margin:0 auto;padding:18px 14px 80px}
.qcard{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 18px 18px;overflow:hidden;border:1px solid var(--border)}
.qcard.anim{animation:rise .35s var(--ease) both}
.ribbon{position:absolute;top:0;left:0;right:0;height:6px;background:var(--grad)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.qchip{background:var(--tint);color:var(--g1);font-weight:700;padding:3px 12px;border-radius:999px;font-family:'Inter',sans-serif;font-size:13px}
.trbtn{min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--border);font-weight:600;font-size:14px;background:var(--soft)}
.trbtn.on{border-color:var(--g1);background:var(--tint)}
.qtext{font-size:1.25rem;font-weight:600;line-height:1.7;font-family:'Inter',sans-serif;direction:ltr;text-align:left}
.qar{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--tint);font-size:1.05rem;direction:rtl;text-align:right;animation:slide .3s var(--ease) both}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card);text-align:left;direction:ltr;transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease);position:relative}
.opt:not(:disabled):hover{transform:translateY(-2px);border-color:var(--g1);box-shadow:0 6px 18px rgba(15,23,42,.1)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center;font-family:'Inter',sans-serif}
.opt .b{flex:1;font-family:'Inter',sans-serif;font-size:16px}
.opt .oar{display:block;margin-top:6px;padding-top:6px;border-top:1px dotted var(--muted);font-size:13px;color:var(--muted);direction:rtl;text-align:right;font-family:'Cairo',sans-serif}
.opt .mk{flex:none;font-size:20px;font-weight:700;width:24px;text-align:center}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;color:#fff}
.opt.right .oar{color:#dcfce7;border-color:#bbf7d0}
.opt.wrong{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#dc2626;color:#fff}
.opt.wrong .oar{color:#fee2e2;border-color:#fecaca}
.opt.right .l,.opt.wrong .l{background:rgba(255,255,255,.25)}
.opt.reveal{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
.opt.reveal .mk{color:#22c55e}
.opt.dim{opacity:.6}
.exp{margin-top:18px;animation:slide .35s var(--ease) both}
.exp .hd{font-weight:700;font-size:17px;margin-bottom:8px}
.exp .hd.ok{color:var(--ok)}.exp .hd.no{color:var(--err)}
.eb{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:15px;line-height:1.7;margin-bottom:8px}
.eb.en{font-family:'Inter',sans-serif}
.eb.ar{background:var(--tint);border-color:transparent}
.nextbtn{display:block;margin-inline-start:0;min-height:50px;padding:10px 28px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(15,23,42,.18);margin-top:6px}

/* ---------- Results ---------- */
.res{text-align:center;animation:rise .5s var(--ease) both}
.ring{position:relative;width:200px;height:200px;margin:10px auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:700;font-family:'Inter',sans-serif;direction:ltr}
.gradeL{font-size:56px;font-weight:700;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#d81b60,#8e24aa);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 4px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-family:'Inter',sans-serif}
.stat span{font-size:12px;color:var(--muted)}
.bars{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:start;margin-bottom:16px}
.bar{margin:10px 0}
.bar .bt{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.bar .tr{height:12px;border-radius:99px;background:var(--border);overflow:hidden}
.bar .tr>div{height:100%;border-radius:99px;transition:width .9s var(--ease)}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.fc{min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--border);font-weight:600;font-size:14px;background:var(--card)}
.fc.on{background:var(--grad);color:#fff;border-color:transparent}
.rv{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;text-align:start;overflow:hidden}
.rv summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;min-height:48px}
.rv summary::-webkit-details-marker{display:none}
.rv .st{font-size:18px;font-weight:700;flex:none;width:24px;text-align:center}
.rv.ok .st{color:var(--ok)}.rv.no .st{color:var(--err)}.rv.na .st{color:var(--muted)}
.rv .qq{font-family:'Inter',sans-serif;direction:ltr;text-align:left;font-size:14px;font-weight:600;flex:1}
.rvb{padding:0 14px 14px;font-size:14px}
.rvb p{margin:6px 0}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{min-height:50px;padding:10px 26px;border-radius:14px;font-weight:700;font-size:16px;color:#fff}
.btn.a{background:linear-gradient(135deg,#d81b60,#8e24aa)}.btn.b{background:var(--grad)}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--card);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mbox .btns{margin-top:14px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(216,27,96,.4)}50%{box-shadow:0 8px 36px rgba(216,27,96,.7)}}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:420px){h1{font-size:26px}.glow-text{font-size:2.2rem}.sacred .main{font-size:22px}.qtext{font-size:1.1rem}.stats{grid-template-columns:1fr 1fr}.topin .ttl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.ib,.trbtn,.nextbtn,.btns,.filters,.start,.hint,#modal,#intro-screen{display:none!important}
  body{background:#fff;color:#000}body::before{display:none}
  .rv .rvb{display:block}.rv{break-inside:avoid}
}
</style>
</head>
<body>

<!-- Intro Animation (بدون onclick عشان نربطها بالجافاسكريبت بشكل أضمن) -->
<div id="intro-screen">
    <h1 class="glow-text">أهلاً بطلاب معهد تمريض شربين 😉🫶🏻👋🏻</h1>
    <div class="loading-bar"><span></span></div>
</div>

<div id="app"></div>
<div id="live" class="hidden" aria-live="polite"></div>

<script>
// ═══════════════════ DATA ═══════════════════
const RAW = `
1|INT|What is the function of the Bartholin glands?|ما هي وظيفة غدد بارثولين؟|Menstrual flow discharge~إفراز دم الحيض|Vaginal lubrication~ترطيب المهبل|Hormone production~إنتاج الهرمونات|Fetal nourishment~تغذية الجنين|B|Bartholin glands secrete mucus to provide vaginal lubrication.|غدد بارثولين تفرز المخاط لتوفير الترطيب المهبلي.
2|INT|What is the most common shape of the hymen?|ما هو الشكل الأكثر شيوعاً لغشاء البكارة؟|Imperforate~مصمت|Septate~مفصول|Annular / half-moon~حلقي / نصف قمر|Cribriform~منقب|C|The annular (half-moon) shape is the most common normal hymen.|الشكل الحلقي (نصف القمر) هو الشكل الطبيعي الأكثر شيوعاً.
3|INT|What is the normal pH of the vagina?|ما هو الأس الهيدروجيني الطبيعي للمهبل؟|Alkaline pH 7.5~قلوي 7.5|Neutral pH 7.0~متعادل 7.0|Acidic pH 4.5~حمضي 4.5|Acidic pH 2.0~حمضي 2.0|C|The normal vaginal pH is acidic (3.8-4.5) to prevent infections.|الأس الهيدروجيني الطبيعي للمهبل حمضي لمنع العدوى.
4|INT|What is the function of the vaginal rugae (folds)?|ما هي وظيفة طيات المهبل؟|Produce mucus~إنتاج المخاط|Allow the vagina to stretch during childbirth~السماح للمهبل بالتمدد أثناء الولادة|Maintain acidic pH~الحفاظ على الحموضة|Prevent infection~منع العدوى|B|Rugae allow significant stretching and expansion during delivery.|تسمح الطيات بتمدد وتوسع كبير أثناء الولادة.
5|INT|What is the approximate length of the vagina?|ما هو الطول التقريبي للمهبل؟|4 to 6 cm~4 إلى 6 سم|8 to 10 cm~8 إلى 10 سم|12 to 14 cm~12 إلى 14 سم|15 to 20 cm~15 إلى 20 سم|B|The anterior wall is about 7.5 cm and the posterior wall is about 9 cm.|الجدار الأمامي حوالي 7.5 سم والخلفي حوالي 9 سم.
6|INT|What is the approximate length of the cervix?|ما هو الطول التقريبي لعنق الرحم؟|1 to 2 cm~1 إلى 2 سم|2.5 to 3 cm~2.5 إلى 3 سم|4 to 5 cm~4 إلى 5 سم|7 to 8 cm~7 إلى 8 سم|B|The cervix measures approximately 2.5 to 3 cm in length.|يقيس عنق الرحم حوالي 2.5 إلى 3 سم في الطول.
7|INT|What is the normal weight of the non-pregnant uterus?|ما هو الوزن الطبيعي للرحم غير الحامل؟|10 - 20 gm~10 - 20 جم|50 - 70 gm~50 - 70 جم|100 - 150 gm~100 - 150 جم|200 - 300 gm~200 - 300 جم|B|The non-pregnant uterus weighs about 50-70 grams.|الرحم غير الحامل يزن حوالي 50-70 جرام.
8|INT|What is the normal position of the uterus?|ما هو الوضع الطبيعي للرحم؟|Retroverted & Retroflexed~خلفي ومنعكس للخلف|Anteverted & Anteflexed~أمامي ومنعكس للأمام|Laterally deviated~منحرف جانبياً|Midline only~في المنتصف فقط|B|The normal position is anteverted and anteflexed.|الوضع الطبيعي هو الانقلاب الأمامي والانثناء الأمامي.
9|INT|What are the dimensions of the uterus?|ما هي إبعاد الرحم؟|5 x 3 x 1 cm~5 × 3 × 1 سم|7.5 x 5 x 2.5 cm~7.5 × 5 × 2.5 سم|10 x 6 x 4 cm~10 × 6 × 4 سم|12 x 8 x 5 cm~12 × 8 × 5 سم|B|The uterus is a pear-shaped organ measuring about 7.5 x 5 x 2.5 cm.|الرحم عضو بشكل كمثرى يقيس حوالي 7.5 × 5 × 2.5 سم.
10|INT|What is the length of the fallopian tube?|ما هو طول قناة فالوب؟|4 to 6 cm~4 إلى 6 سم|8 to 14 cm~8 إلى 14 سم|15 to 20 cm~15 إلى 20 سم|2 to 3 cm~2 إلى 3 سم|B|The fallopian tube measures approximately 10 cm (range 8-14 cm).|طول قناة فالوب حوالي 10 سم (يتراوح من 8-14 سم).

    c:'Correct',w:'Wrong',pct:'Score',dur:'Time',all:'All',wo:'Wrong only',co:'Correct only',un:'Unanswered',
    your:'Your answer',corr:'Correct answer',none:'Not answered',res:'Results',byLec:'Score by lecture',
    exit:'End the quiz and return home?',yes:'Yes',cancel:'Cancel',empty:'Nothing here',expl:'Explanation'}
};
const t = k => (I18N[S.lang]||I18N.ar)[k];

// ═══════════════════ STATE ═══════════════════
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const S = {
  lang:'ar', theme:'dark', soundOn:true,
  settings:{lectures:[...LEC_ORDER],shuffleQ:true,shuffleO:true},
  screen:'welcome',
  quiz:null, showAr:false, filter:'all'
};

function loadSettings(){
  S.lang = LS.get('pedsQuiz.lang','ar');
  S.theme = LS.get('pedsQuiz.theme','dark');
  S.soundOn = LS.get('pedsQuiz.soundOn',true);
  const st = LS.get('pedsQuiz.settings',null);
  if(st && Array.isArray(st.lectures)) S.settings = Object.assign(S.settings, st);
}
function saveSettings(){
  LS.set('pedsQuiz.lang',S.lang);LS.set('pedsQuiz.theme',S.theme);
  LS.set('pedsQuiz.soundOn',S.soundOn);LS.set('pedsQuiz.settings',S.settings);
}
function applyTheme(th){S.theme=th;document.documentElement.setAttribute('data-theme',th);saveSettings();}
function applyLanguage(lg){
  S.lang=lg;
  document.documentElement.lang = lg;
  document.documentElement.dir = lg==='ar'?'rtl':'ltr';
  saveSettings();
}
function saveProgress(){
  try{ if(S.quiz) sessionStorage.setItem('pedsQuiz.progress',JSON.stringify(S.quiz)); }catch(e){}
}
function loadProgress(){
  try{const v=sessionStorage.getItem('pedsQuiz.progress');if(!v)return null;
    const q=JSON.parse(v);
    if(q && Array.isArray(q.order) && q.order.every(id=>QBYID[id])) return q;
  }catch(e){}
  return null;
}
function clearProgress(){try{sessionStorage.removeItem('pedsQuiz.progress');}catch(e){}}

function shuffleArray(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const app = $('#app');
function announce(m){const l=$('#live');l.textContent=m;}

// ═══════════════════ SOUND ═══════════════════
let AC=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC && AC.state==='suspended') AC.resume();
}
function tone(type,f0,f1,dur,vol,wobble){
  if(!S.soundOn||!AC) return;
  const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,now);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,now+dur);
  if(wobble){
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.frequency.value=28;lg.gain.value=18;lfo.connect(lg);lg.connect(o.frequency);lfo.start(now);lfo.stop(now+dur);
  }
  g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+dur+0.02);
}
function playCorrect(){tone('sine',880,1320,.32,.15,false);}
function playWrong(){tone('sawtooth',220,220,.26,.15,true);}
function playClick(){tone('sine',600,600,.06,.08,false);}

// ═══════════════════ WELCOME ═══════════════════
function bestScore(){return LS.get('pedsQuiz.best',null);}
function renderWelcome(){
  S.screen='welcome';
  const st=S.settings, b=bestScore();
  app.innerHTML = `
  <div class="wrap">

    </div>
    <div class="sacred">
      <div class="ic">🕌</div>
      <div class="main ar">«اللهم صلِّ وسلِّم على نبينا محمد ﷺ»</div>

    </div>

          return `<label class="lec"><input type="checkbox" data-lec="${id}" ${st.lectures.includes(id)?'checked':''}>

      <div class="row"><label class="t" for="swO">${t('shuffleO')}</label><span class="sw"><input type="checkbox" id="swO" ${st.shuffleO?'checked':''}><i></i></span></div>

// ═══════════════════ QUIZ ═══════════════════
function startQuiz(){
  initAudio();
  const sel = S.settings.lectures;
  if(!sel.length){$('#werr').classList.remove('hidden');return;}
  let ids = QUESTIONS.filter(q=>sel.includes(q.lectureId)).map(q=>q.id);
  if(S.settings.shuffleQ) ids = shuffleArray(ids);
  const optOrder={};
  ids.forEach(id=>{optOrder[id]=S.settings.shuffleO?shuffleArray([0,1,2,3]):[0,1,2,3];});
  S.quiz={order:ids,optOrder,idx:0,answers:{},start:Date.now(),elapsed:0};
  S.showAr=false;
  saveProgress();
  renderQuestion(true);
}
function curQ(){return QBYID[S.quiz.order[S.quiz.idx]];}
function counts(){
  let c=0,w=0;
  S.quiz.order.forEach(id=>{const a=S.quiz.answers[id];if(a===undefined)return;if(a===QBYID[id].correctIndex)c++;else w++;});
  return {c,w};
}
function setLectureVars(q){
  const L=LECTURES[q.lectureId],r=document.documentElement.style;
  r.setProperty('--grad',L.grad);r.setProperty('--g1',L.c1);r.setProperty('--g2',L.c2);r.setProperty('--tint',L.tint);
}
function resetLectureVars(){
  const r=document.documentElement.style;['--grad','--g1','--g2','--tint'].forEach(p=>r.removeProperty(p));
}
function renderQuestion(anim){
  S.screen='quiz';
  const Z=S.quiz,q=curQ(),L=LECTURES[q.lectureId];
  setLectureVars(q);
  const perm=Z.optOrder[q.id], ans=Z.answers[q.id], answered=ans!==undefined;
  const {c,w}=counts(), total=Z.order.length;
  const optsHtml = perm.map((orig,p)=>{
    const o=q.options[orig]; let cls='',mk='';
    if(answered){
      if(orig===q.correctIndex){cls = ans===orig?'right':'reveal';mk='✓';}
      else if(orig===ans){cls='wrong';mk='✗';}
      else cls='dim';
    }
    return `<button class="opt ${cls}" data-p="${p}" ${answered?'disabled':''} aria-label="${'ABCD'[p]}: ${esc(o.en)}">
      <span class="l">${'ABCD'[p]}</span>
      <span class="b">${esc(o.en)}${S.showAr&&o.ar?`<span class="oar">${esc(o.ar)}</span>`:''}</span>
      <span class="mk">${mk}</span></button>`;
  }).join('');
  let exp='';
  if(answered){
    const ok=ans===q.correctIndex, last=Z.idx===total-1;
    exp = `<div class="exp"><div class="hd ${ok?'ok':'no'}">${ok?I18N.ar.ok:I18N.ar.no}</div>
      <div class="eb en">${esc(q.expEn)}</div>
      <div class="eb ar">${esc(q.expAr)}</div>
      <button class="nextbtn" id="nextBtn">${I18N.ar.next.replace(I18N.ar.next,last?I18N.ar.finish:I18N.ar.next)}</button></div>`;
  }
  app.innerHTML = `
  <div class="top"><div class="topin">
    <span class="ttl">${I18N.ar.title}</span>
    <span class="mid"><span class="chip" style="background:${L.grad}">${L.en}</span><span>${I18N.ar.q} ${Z.idx+1} / ${total}</span></span>
    <span class="end"><span>✓ ${c} · ✗ ${w}</span>
      <button class="ib" id="sndBtn" aria-label="sound">${S.soundOn?'🔊':'🔇'}</button>
      <button class="ib" id="homeBtn" aria-label="home">🏠</button></span>
  </div><div class="prog"><div style="width:${(Z.idx+(answered?1:0))/total*100}%"></div></div></div>
  <div class="qwrap"><div class="qcard ${anim?'anim':''}">
    <div class="ribbon"></div>
    <div class="qhead"><span class="qchip">Q${q.id}</span>
      <button class="trbtn ${S.showAr?'on':''}" id="trBtn" aria-pressed="${S.showAr}">${I18N.ar.tr}</button></div>
    <div class="qtext">${esc(q.questionEn)}</div>
    ${S.showAr?`<div class="qar">${esc(q.questionAr)}</div>`:''}
    <div class="opts" role="group">${optsHtml}</div>
    ${exp}
  </div></div>`;
  if(answered) setTimeout(()=>{const n=$('#nextBtn');if(n){n.scrollIntoView({block:'nearest',behavior:'smooth'});}},60);
}
function toggleTranslation(){S.showAr=!S.showAr;renderQuestion(false);}
function selectOption(p){
  const Z=S.quiz,q=curQ();
  if(Z.answers[q.id]!==undefined) return;
  initAudio();
  const orig=Z.optOrder[q.id][p];
  Z.answers[q.id]=orig;
  Z.elapsed=Date.now()-Z.start;
  const ok=orig===q.correctIndex;
  ok?playCorrect():playWrong();
  saveProgress();
  announce(ok?I18N.ar.ok:I18N.ar.no);
  renderQuestion(false);
}
function renderExplanation(){renderQuestion(false);}
function nextQuestion(){
  const Z=S.quiz;
  if(Z.answers[curQ().id]===undefined) return;
  if(Z.idx>=Z.order.length-1){endQuiz();return;}
  Z.idx++;S.showAr=false;saveProgress();
  playClickSilent();
  renderQuestion(true);window.scrollTo(0,0);
}
function playClickSilent(){/* click sound only on answer per spec */}

// ═══════════════════ RESULTS ═══════════════════
function endQuiz(){
  const Z=S.quiz;
  Z.finished=true;
  Z.duration=Date.now()-Z.start;
  const {c}=counts();
  const pct=Math.round(c/Z.order.length*100);
  const best=bestScore();
  if(best===null||pct>best) LS.set('pedsQuiz.best',pct);
  clearProgress();
  S.filter='all';
  renderResults();
}
function gradeOf(p){return p>=85?'A':p>=75?'B':p>=65?'C':p>=50?'D':'F';}
function fmtTime(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function renderResults(){
  S.screen='results';resetLectureVars();
  const Z=S.quiz,total=Z.order.length,{c,w}=counts(),un=total-c-w;
  const pct=Math.round(c/total*100),R=70,C=2*Math.PI*R;
  const per=LEC_ORDER.map(id=>{
    const ids=Z.order.filter(i=>QBYID[i].lectureId===id);if(!ids.length)return null;
    const ok=ids.filter(i=>Z.answers[i]===QBYID[i].correctIndex).length;
    return {id,n:ids.length,ok,p:Math.round(ok/ids.length*100)};
  }).filter(Boolean);
  const flt = (id)=>{const a=Z.answers[id],q=QBYID[id];
    if(S.filter==='all')return true;
    if(S.filter==='wrong')return a!==undefined&&a!==q.correctIndex;
    if(S.filter==='right')return a===q.correctIndex;
    return a===undefined;};
  const items=Z.order.filter(flt);
  app.innerHTML = `
  <div class="wrap res">
    <h1>${t('res')}</h1>
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d81b60"/><stop offset="1" stop-color="#8e24aa"/></linearGradient></defs>
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--border)" stroke-width="16"/>
        <circle id="arc" cx="100" cy="100" r="${R}" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"/>
      </svg><div class="n" id="cnt">0%</div></div>
    <div class="gradeL">${gradeOf(pct)}</div>
    <div class="stats">
      <div class="stat"><b style="color:var(--ok)">${c}</b><span>✓ ${t('c')}</span></div>
      <div class="stat"><b style="color:var(--err)">${w+un}</b><span>✗ ${t('w')}</span></div>
      <div class="stat"><b>${pct}%</b><span>${t('pct')}</span></div>
      <div class="stat"><b>${fmtTime(Z.duration||0)}</b><span>${t('dur')}</span></div>
    </div>
    <div class="bars"><b>${t('byLec')}</b>
      ${per.map(x=>`<div class="bar"><div class="bt"><span>${LECTURES[x.id].en} · ${LECTURES[x.id].ar}</span><span class="en">${x.ok}/${x.n} · ${x.p}%</span></div>
        <div class="tr"><div style="width:0;background:${LECTURES[x.id].grad}" data-w="${x.p}"></div></div></div>`).join('')}
    </div>
    <div class="filters">
      ${[['all','all'],['wrong','wo'],['right','co'],['un','un']].map(([k,l])=>`<button class="fc ${S.filter===k?'on':''}" data-f="${k}">${t(l)}</button>`).join('')}
    </div>
    <div id="rlist">${items.length?items.map(id=>reviewItem(id)).join(''):`<p style="color:var(--muted)">${t('empty')}</p>`}</div>
    <div class="btns"><button class="btn a" id="againBtn">${t('again')}</button><button class="btn b" id="homeBtn2">${t('homeB')}</button></div>
  </div>`;
  requestAnimationFrame(()=>{
    const arc=$('#arc');if(arc)arc.style.strokeDashoffset=C*(1-pct/100);
    document.querySelectorAll('.bar .tr>div').forEach(d=>d.style.width=d.dataset.w+'%');
    const el=$('#cnt'),t0=performance.now(),D=1200;
    (function step(now){const k=Math.min(1,(now-t0)/D);el.textContent=Math.round(pct*k)+'%';if(k<1)requestAnimationFrame(step);})(t0);
  });
}
function reviewItem(id){
  const q=QBYID[id],a=q.id&&S.quiz.answers[id];
  const ans=S.quiz.answers[id];
  const cls=ans===undefined?'na':ans===q.correctIndex?'ok':'no';
  const mk=ans===undefined?'–':ans===q.correctIndex?'✓':'✗';
  const you=ans===undefined?t('none'):q.options[ans].en;
  const youAr=ans===undefined?'':q.options[ans].ar;
  return `<details class="rv ${cls}"><summary><span class="st">${mk}</span><span class="qq">Q${q.id} · ${esc(q.questionEn)}</span></summary>
    <div class="rvb">
      <p class="ar" style="font-weight:600">${esc(q.questionAr)}</p>
      <p><b>${t('your')}:</b> <span class="en">${esc(you)}</span>${youAr?` <span class="ar">— ${esc(youAr)}</span>`:''}</p>
      <p><b>${t('corr')}:</b> <span class="en">${esc(q.options[q.correctIndex].en)}</span> <span class="ar">— ${esc(q.options[q.correctIndex].ar)}</span></p>
      <div class="eb en">${esc(q.expEn)}</div><div class="eb ar">${esc(q.expAr)}</div>
    </div></details>`;
}

// ═══════════════════ NAV / EXIT ═══════════════════
function goHome(){
  clearProgress();S.quiz=null;resetLectureVars();renderWelcome();window.scrollTo(0,0);
}
function confirmExit(){
  if(document.getElementById('modal')) return;
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p style="font-weight:700">${I18N.ar.exit}</p>
    <div class="btns"><button class="btn a" id="mYes">${I18N.ar.yes}</button><button class="btn b" id="mNo" style="background:#64748b">${I18N.ar.cancel}</button></div></div>`;
  document.body.appendChild(m);
  $('#mYes').onclick=()=>{m.remove();goHome();};
  $('#mNo').onclick=()=>m.remove();
  $('#mNo').focus();
}

// ═══════════════════ EVENTS ═══════════════════
document.addEventListener('click',e=>{
  const T=e.target;
  const opt=T.closest('.opt');
  if(opt && S.screen==='quiz'){selectOption(+opt.dataset.p);return;}
  if(T.closest('#nextBtn')){nextQuestion();return;}
  if(T.closest('#trBtn')){toggleTranslation();return;}
  if(T.closest('#sndBtn')){S.soundOn=!S.soundOn;saveSettings();initAudio();renderQuestion(false);return;}
  if(T.closest('#homeBtn')){confirmExit();return;}
  if(T.closest('#homeBtn2')){goHome();return;}
  if(T.closest('#againBtn')){startQuiz();return;}
  if(T.closest('#startBtn')){startQuiz();return;}
  const lg=T.closest('[data-lg]');if(lg){applyLanguage(lg.dataset.lg);renderWelcome();return;}
  const th=T.closest('[data-th]');if(th){applyTheme(th.dataset.th);renderWelcome();return;}
  const f=T.closest('[data-f]');if(f){S.filter=f.dataset.f;renderResults();return;}
});
document.addEventListener('change',e=>{
  const T=e.target;
  if(T.dataset && T.dataset.lec){
    const set=new Set(S.settings.lectures);T.checked?set.add(T.dataset.lec):set.delete(T.dataset.lec);
    S.settings.lectures=LEC_ORDER.filter(x=>set.has(x));saveSettings();
    const er=$('#werr');if(er)er.classList.toggle('hidden',S.settings.lectures.length>0);
  }else if(T.id==='swQ'){S.settings.shuffleQ=T.checked;saveSettings();}
  else if(T.id==='swO'){S.settings.shuffleO=T.checked;saveSettings();}
  else if(T.id==='swS'){S.soundOn=T.checked;saveSettings();initAudio();}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if(k==='Escape'){if(S.screen==='quiz')confirmExit();else{const m=$('#modal');if(m)m.remove();}return;}
  if(k==='m'||k==='M'||k==='ة'){if(S.screen!=='welcome'){S.soundOn=!S.soundOn;saveSettings();if(S.screen==='quiz')renderQuestion(false);}return;}
  if(S.screen!=='quiz'||$('#modal')) return;
  const q=curQ(),answered=S.quiz.answers[q.id]!==undefined;
  if(k==='r'||k==='R'||k==='ق'){toggleTranslation();return;}
  if(!answered){
    let p=-1;
    if('1234'.includes(k)&&k.length===1)p=+k-1;
    else{const u=k.toUpperCase();if('ABCD'.includes(u)&&u.length===1)p='ABCD'.indexOf(u);}
    if(p>=0){e.preventDefault();selectOption(p);}
  }else if(k==='Enter'||k===' '){
    e.preventDefault();nextQuestion();
  }
});

// ═══════════════════ INIT ═══════════════════
let introTimer;

function dismissIntro() {
    if(introTimer) clearTimeout(introTimer);
    const intro = document.getElementById('intro-screen');
    if(intro && intro.style.display !== 'none') {
        intro.style.opacity = '0';
        intro.style.pointerEvents = 'none';
        
        setTimeout(() => {
            intro.style.display = 'none';
            const appDiv = document.getElementById('app');
            if(!appDiv.innerHTML || appDiv.innerHTML.trim() === '') {
                init();
            }
        }, 600); // تم تقليل الوقت شوية عشان يكون أسرع
    }
}

// ربط حدث الضغط بطريقة مضمونة
document.getElementById('intro-screen').addEventListener('click', dismissIntro);

function init(){
  try {
    loadSettings();
    applyTheme(S.theme);applyLanguage(S.lang);
    const pr=loadProgress();
    if(pr && !pr.finished){S.quiz=pr;S.showAr=false;renderQuestion(true);}
    else renderWelcome();
  } catch(e) {
    console.error("Initialization error:", e);
    document.getElementById('app').innerHTML = `<div style="padding:20px; text-align:center; color:var(--text);">حدث خطأ أثناء تحميل الاختبار. يرجى تحديث الصفحة.</div>`;
  }
}

// تشغيل المؤقت التلقائي
introTimer = setTimeout(dismissIntro, 3500);

console.log("✅ Loaded " + QUESTIONS.length + " questions");
</script>
